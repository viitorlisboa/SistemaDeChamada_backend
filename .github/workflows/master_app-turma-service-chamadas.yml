name: Build and deploy JAR app to Azure Web App - app-turma-service-chamadas

on:
  push:
    branches:
      - 'master'
    # Deploy só quando o próprio serviço (ou este workflow) mudar
    paths:
      - 'backend/turma-service/**'
      - '.github/workflows/master_app-turma-service-chamadas.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java version
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'microsoft'
          cache: 'maven'

      # Os testes rodam antes do deploy: se algum falhar, nada vai para o Azure
      - name: Build and test with Maven
        run: mvn -B clean verify
        working-directory: backend/turma-service

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: java-app
          path: '${{ github.workspace }}/backend/turma-service/target/*.jar'

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: java-app

      # Autenticação pelo perfil de publicação do App Service (secret AZURE_PUBLISH_PROFILE_TURMA)
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'app-turma-service-chamadas'
          slot-name: 'Production'
          publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE_TURMA }}
          package: '*.jar'
